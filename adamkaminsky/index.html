
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Adam E. Kaminsky — Portfolio</title>

  <style>
    body {
      margin: 12px;
      background: #e8e5dc;
      color: #222222;
      font-family: Arial, Helvetica, sans-serif;
      font-weight: 400;
    }

    h1 {
  font-variant-caps: small-caps;
}

#header-image {
  position: absolute;
  top: 12px;
  right: 12px;
  width: 180px;
  height: 90px;
  object-fit: contain;
  border: 0px solid #222;
  box-sizing: border-box;
  z-index: 10;
}
    

   .tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  padding-right: 185px;
  box-sizing: border-box;
}

    .tabs button {
      padding: 9px 12px;
      background: #d4d0c5 !important;
      color: #222222 !important;
      border: 1px solid #77776e;
      border-radius: 4px 4px 0 0;
      cursor: pointer;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 1.3px;
      font-variant-caps: small-caps;
    }

    .tabs button.active {
      background: var(--tab-color, #56664b) !important;
      color: var(--tab-text, #ffffff) !important;
      border-color: var(--tab-color, #56664b);
    }

    .tabs button:not(.active):hover {
      background: #c5c2b7 !important;
      color: #222222 !important;
    }

    .tabs button.active:hover {
      background: var(--tab-color, #56664b) !important;
      color: var(--tab-text, #ffffff) !important;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      padding: 10px;
      background: #d4d0c5;
      border: 1px solid #888;
      position: sticky;
      top: 0;
      z-index: 100;
      zoom: 0.85;
    }

    button, select {
      font-size: 14px;
      padding: 5px 9px;
    }

    #pdf-viewer {
      margin: 0 auto;
      padding: 12px 0;
      overflow: auto;
    }

    .page {
      margin: 0 auto 12px;
      background: white;
      box-shadow: 0 1px 4px #999;
    }

    .page canvas {
      display: block;
      width: 100%;
      height: auto;
    }

    #status {
      padding: 12px 0;
      font-size: 14px;
    }



#download-button {
  display: inline-block;
  padding: 8px 14px;
  border: 1px solid #222;
  background: #d4d0c5;
  color: #222;
  margin-top: 6px;
  text-decoration: none;
  font-family: Arial, Helvetica, sans-serif;
  font-size: 12px;
  letter-spacing: 0.8px;
  text-transform: uppercase;
}

#download-button:hover {
  background: #c5c0b4;
  color: #222;
}


    /* Phone layout */
@media (max-width: 600px) {
  #header-image {
    position: static;
    display: block;
    width: 180px;
    height: 100px;
   margin: 10px auto 12px 0;
  }

  .tabs {
    padding-right: 0;
    gap: 4px;
  }

  .tabs button {
    padding: 7px 8px;
    font-size: 12px;
    letter-spacing: 0.4px;
  }

  .toolbar {
    gap: 6px;
    padding: 7px;
  }
}
    
  </style>
</head>

<body>
  <h1>Adam E. Kaminsky</h1>

  <img id="header-image" src="Hinge.png" alt="">

  <nav class="tabs" id="tabs">
    
    <button
      class="active"
      data-pdf="Kaminsky_Portfolio.pdf"
      style="--tab-color: #56664b; --tab-text: #ffffff;">
      Portfolio
    </button>

    <button
      data-pdf="Rio_Puerco_Report.pdf"
      style="--tab-color: #996565; --tab-text: #ffffff;">
      Rio Puerco Report
    </button>

    <button
      data-pdf="Indigenous_Rights_Toolkit.pdf"
      style="--tab-color: #AD975E; --tab-text: #222222;">
      Indigenous Rights Toolkit
    </button>

    <button
      data-pdf="Negotiations_Manual.pdf"
      style="--tab-color: #7474AD; --tab-text: #ffffff;">
      Negotiations Manual
    </button>

    <button
  data-contact="true"
  style="--tab-color: #57442B; --tab-text: #ffffff;">
  Contact
</button>
  </nav>

  <div class="toolbar">
    <button id="minus">−</button>
    <span id="zoom-label">100%</span>
    <button id="plus">+</button>
    <button id="fit">FIT WIDTH</button>
    <button id="fitHeight">FIT HEIGHT</button>
    <span id="page-count"></span>
  </div>

  <div id="download-bar">
  <a id="download-button" href="Kaminsky_Portfolio.pdf" download>
    Download PDF ↓
  </a>
</div>

<div id="contact-panel" style="display: none; padding: 30px 20px; background: #e8e5dc; color: #222; font-family: Arial, Helvetica, sans-serif;">
  <p>Adam E. Kaminsky<p>
  </p>minsky@umich.edu<p>
  <p>802-735-5894</p>
</div>
  
  <div id="status">Loading PDF viewer…</div>
  <main id="pdf-viewer"></main>



<script type="module">
  import * as pdfjsLib from
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs";

  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";

  const viewer = document.getElementById("pdf-viewer");
  const status = document.getElementById("status");
  const zoomLabel = document.getElementById("zoom-label");
  const pageCount = document.getElementById("page-count");

  let pdf = null;
  let zoom = 1;
  let fitWidth = true;
  let fitHeight = false;

  let renderId = 0;
  let layoutId = 0;
  let pageInfo = [];
  let renderTasks = new Map();
  let renderedPages = new Map();
  let zoomRenderTimer;
  let resizeTimer;
  let scrollTimer;
  let renderingNearby = false;

  function getScale(info) {
    const availableWidth = Math.max(240, viewer.clientWidth - 24);
    const availableHeight = Math.max(200, window.innerHeight - 140);

    if (fitWidth) return availableWidth / info.width;
    if (fitHeight) return availableHeight / info.height;
    return zoom;
  }

  function cancelPageRenders() {
    for (const task of renderTasks.values()) {
      try {
        task.cancel();
      } catch (error) {
        // A task may already have finished.
      }
    }

    renderTasks.clear();
  }

  async function loadPDF(filename) {
    const thisRender = ++renderId;
    ++layoutId;

    cancelPageRenders();
    viewer.replaceChildren();
    pageInfo = [];
    renderedPages.clear();

    status.textContent = "Loading " + filename + "…";
    pageCount.textContent = "";
    pdf = null;

    try {
      const task = pdfjsLib.getDocument(filename);
      const documentPDF = await task.promise;

      if (thisRender !== renderId) return;

      pdf = documentPDF;
      status.textContent = "";
      pageCount.textContent = pdf.numPages + " pages";

      // Get page dimensions to create lightweight placeholders.
      for (let n = 1; n <= pdf.numPages; n++) {
        if (thisRender !== renderId) return;

        const page = await pdf.getPage(n);
        if (thisRender !== renderId) return;

        const base = page.getViewport({ scale: 1 });

        pageInfo.push({
          number: n,
          width: base.width,
          height: base.height
        });
      }

      if (thisRender !== renderId) return;

      window.scrollTo(0, 0);
      buildPageLayout(false);
    } catch (error) {
      if (thisRender !== renderId) return;

      status.textContent =
        "Could not load " + filename +
        ". Check that the PDF is in this folder and the filename matches.";

      console.error(error);
    }
  }

  function buildPageLayout(preservePosition = true) {
    if (!pdf || !pageInfo.length) return;

    const thisLayout = ++layoutId;
    cancelPageRenders();
    renderedPages.clear();

    // Save the visible page and position within it.
    const markerY = Math.max(110, viewer.getBoundingClientRect().top);
    const oldPages = Array.from(viewer.querySelectorAll(".page"));

    let anchorIndex = 0;
    let anchorFraction = 0;

    if (preservePosition) {
      for (let i = 0; i < oldPages.length; i++) {
        const rect = oldPages[i].getBoundingClientRect();

        if (rect.bottom > markerY && rect.height > 0) {
          anchorIndex = i;
          anchorFraction = Math.max(
            0,
            Math.min(1, (markerY - rect.top) / rect.height)
          );
          break;
        }
      }
    }

    zoomLabel.textContent = Math.round(
      (fitWidth || fitHeight)
        ? getScale(pageInfo[0])
        : zoom
    * 100) + "%";

    // Create correctly sized placeholders for all pages.
    const fragment = document.createDocumentFragment();

    for (const info of pageInfo) {
      const scale = getScale(info);
      const wrapper = document.createElement("section");

      wrapper.className = "page";
      wrapper.dataset.pageNumber = info.number;
      wrapper.style.width = Math.ceil(info.width * scale) + "px";
      wrapper.style.height = Math.ceil(info.height * scale) + "px";
      wrapper.style.minHeight = Math.ceil(info.height * scale) + "px";

      fragment.appendChild(wrapper);
    }

    viewer.replaceChildren(fragment);

    // Restore the same relative position on the same page.
    if (preservePosition) {
      const target = viewer.querySelectorAll(".page")[anchorIndex];

      if (target) {
        const newRect = target.getBoundingClientRect();
        const desiredTop = markerY - anchorFraction * newRect.height;

        window.scrollBy(0, newRect.top - desiredTop);
      }
    }

    requestAnimationFrame(() => {
      if (thisLayout === layoutId) renderNearbyPages();
    });
  }

  async function renderOnePage(index, thisLayout) {
    if (
      thisLayout !== layoutId ||
      !pdf ||
      index < 0 ||
      index >= pageInfo.length
    ) return;

    const info = pageInfo[index];
    const key = info.number;
    const wrapper = viewer.querySelector(
      '.page[data-page-number="' + key + '"]'
    );

    if (!wrapper || renderedPages.has(key) || renderTasks.has(key)) {
      return;
    }

    const currentPDF = pdf;
    const scale = getScale(info);

    try {
      const page = await currentPDF.getPage(key);

      if (
        thisLayout !== layoutId ||
        currentPDF !== pdf ||
        !wrapper.isConnected
      ) return;

      const viewport = page.getViewport({ scale });
      const canvas = document.createElement("canvas");
      const context = canvas.getContext("2d");
      const ratio = window.devicePixelRatio || 1;

      canvas.width = Math.floor(viewport.width * ratio);
      canvas.height = Math.floor(viewport.height * ratio);
      canvas.style.width = viewport.width + "px";
      canvas.style.height = viewport.height + "px";
      canvas.style.display = "block";

      wrapper.appendChild(canvas);

      const task = page.render({
        canvasContext: context,
        viewport,
        transform: ratio !== 1
          ? [ratio, 0, 0, ratio, 0, 0]
          : null
      });

      renderTasks.set(key, task);
      await task.promise;

      if (
        thisLayout === layoutId &&
        currentPDF === pdf &&
        wrapper.isConnected
      ) {
        renderedPages.set(key, scale);
      }
    } catch (error) {
      if (
        error?.name !== "RenderingCancelledException" &&
        thisLayout === layoutId
      ) {
        console.error("Could not render PDF page " + key, error);
      }
    } finally {
      renderTasks.delete(key);
    }
  }

  async function renderNearbyPages() {
    if (!pdf || !pageInfo.length || renderingNearby) return;

    const thisLayout = layoutId;
    const wrappers = Array.from(viewer.querySelectorAll(".page"));

    if (!wrappers.length) return;

    // Find the visible range of pages.
    let firstVisible = -1;
    let lastVisible = -1;

    for (let i = 0; i < wrappers.length; i++) {
      const rect = wrappers[i].getBoundingClientRect();

      if (rect.bottom > 0 && rect.top < window.innerHeight) {
        if (firstVisible === -1) firstVisible = i;
        lastVisible = i;
      }
    }

    if (firstVisible === -1) return;

    // Render the visible pages plus one neighbor on each side.
    const start = Math.max(0, firstVisible - 1);
    const end = Math.min(wrappers.length - 1, lastVisible + 1);

    renderingNearby = true;

    try {
      for (let i = start; i <= end; i++) {
        if (thisLayout !== layoutId) return;
        await renderOnePage(i, thisLayout);
      }
    } finally {
      renderingNearby = false;
    }

    // If the user scrolled during rendering, catch up to the new position.
    if (thisLayout === layoutId) {
      const visibleNow = Array.from(viewer.querySelectorAll(".page"));
      const hasUnrenderedVisiblePage = visibleNow.some(wrapper => {
        const rect = wrapper.getBoundingClientRect();
        const number = Number(wrapper.dataset.pageNumber);

        return (
          rect.bottom > 0 &&
          rect.top < window.innerHeight &&
          !renderedPages.has(number) &&
          !renderTasks.has(number)
        );
      });

      if (hasUnrenderedVisiblePage) {
        requestAnimationFrame(renderNearbyPages);
      }
    }
  }

  // Render additional pages as the user scrolls.
  window.addEventListener("scroll", () => {
    clearTimeout(scrollTimer);
    scrollTimer = setTimeout(renderNearbyPages, 60);
  }, { passive: true });

   // Switch projects or show contact information.
  document.getElementById("tabs").addEventListener("click", event => {
    const button = event.target.closest("#tabs button");
    if (!button) return;

    document.querySelectorAll("#tabs button").forEach(tab => {
      tab.classList.toggle("active", tab === button);
    });

    if (button.dataset.contact) {
      // Contact tab selected.
      document.getElementById("download-bar").style.display = "none";
      document.getElementById("pdf-viewer").style.display = "none";
      document.getElementById("contact-panel").style.display = "block";
      return;
    }

    // PDF project tab selected.
    document.getElementById("download-bar").style.display = "";
    document.getElementById("pdf-viewer").style.display = "";
    document.getElementById("contact-panel").style.display = "none";
    document.getElementById("download-button").href = button.dataset.pdf;
    loadPDF(button.dataset.pdf);
  });

  function scheduleZoomRender() {
    clearTimeout(zoomRenderTimer);
    zoomRenderTimer = setTimeout(() => {
      buildPageLayout(true);
    }, 300);
  }

 function getCurrentPageScale() {
  const pages = Array.from(viewer.querySelectorAll(".page"));

  const currentPage = pages.find(page => {
    const rect = page.getBoundingClientRect();
    return rect.bottom > 0 && rect.top < window.innerHeight;
  });

  const pageNumber = Number(
    currentPage?.dataset.pageNumber || 1
  );

  return getScale(pageInfo[pageNumber - 1]);
}

document.getElementById("minus").onclick = () => {
  if (fitWidth || fitHeight) {
    zoom = getCurrentPageScale();
  }

  fitWidth = false;
  fitHeight = false;
  zoom = Math.max(0.25, zoom - 0.1);
  scheduleZoomRender();
};

document.getElementById("plus").onclick = () => {
  if (fitWidth || fitHeight) {
    zoom = getCurrentPageScale();
  }

  fitWidth = false;
  fitHeight = false;
  zoom = Math.min(3, zoom + 0.1);
  scheduleZoomRender();
};

document.getElementById("fit").onclick = () => {
  fitWidth = true;
  fitHeight = false;
  scheduleZoomRender();
};

document.getElementById("fitHeight").onclick = () => {
  fitWidth = false;
  fitHeight = true;
  scheduleZoomRender();
};
  window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);

    resizeTimer = setTimeout(() => {
      if (fitWidth || fitHeight) {
        buildPageLayout(true);
      }
    }, 200);
  });

  loadPDF("Kaminsky_Portfolio.pdf");
</script>

</body>
</html>
