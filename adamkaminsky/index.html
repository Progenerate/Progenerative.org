
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Adam E. Kaminsky — Portfolio</title>

  <style>
    body {
      margin: 12px;
      background: #e8e5dc;
      color: #222222;
      font-family: Arial, Helvetica, sans-serif;
      font-weight: 400;
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .tabs button {
      padding: 9px 12px;
      background: #d4d0c5 !important;
      color: #222222 !important;
      border: 1px solid #77776e;
      border-radius: 4px 4px 0 0;
      cursor: pointer;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 0.8px;
    }

    .tabs button.active {
      background: var(--tab-color, #56664b) !important;
      color: var(--tab-text, #ffffff) !important;
      border-color: var(--tab-color, #56664b);
    }

    .tabs button:not(.active):hover {
      background: #c5c2b7 !important;
      color: #222222 !important;
    }

    .tabs button.active:hover {
      background: var(--tab-color, #56664b) !important;
      color: var(--tab-text, #ffffff) !important;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      padding: 10px;
      background: #d4d0c5;
      border: 1px solid #888;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    button, select {
      font-size: 14px;
      padding: 5px 9px;
    }

    #pdf-viewer {
      margin: 0 auto;
      padding: 12px 0;
      overflow: auto;
    }

    .page {
      margin: 0 auto 12px;
      background: white;
      box-shadow: 0 1px 4px #999;
    }

    .page canvas {
      display: block;
      width: 100%;
      height: auto;
    }

    #status {
      padding: 12px 0;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <h1>ADAM E. KAMINSKY</h1>

  <nav class="tabs" id="tabs">
    <button
      class="active"
      data-pdf="Kaminsky_Portfolio.pdf"
      style="--tab-color: #56664b; --tab-text: #ffffff;">
      Portfolio
    </button>

    <button
      data-pdf="Rio_Puerco_Report.pdf"
      style="--tab-color: #996565; --tab-text: #ffffff;">
      Rio Puerco Report
    </button>

    <button
      data-pdf="Indigenous_Rights_Toolkit.pdf"
      style="--tab-color: #AD975E; --tab-text: #222222;">
      Indigenous Rights Toolkit
    </button>

    <button
      data-pdf="Negotiations_Manual.pdf"
      style="--tab-color: #7474AD; --tab-text: #ffffff;">
      Negotiations Manual
    </button>
  </nav>

  <div class="toolbar">
    <button id="minus">−</button>
    <span id="zoom-label">100%</span>
    <button id="plus">+</button>
    <button id="fit">FIT WIDTH</button>
    <button id="fitHeight">FIT HEIGHT</button>
    <span id="page-count"></span>
  </div>

  <div id="status">Loading PDF viewer…</div>
  <main id="pdf-viewer"></main>

  <script type="module">
    import * as pdfjsLib from
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs";

    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";

    const viewer = document.getElementById("pdf-viewer");
    const status = document.getElementById("status");
    const zoomLabel = document.getElementById("zoom-label");
    const pageCount = document.getElementById("page-count");

    let pdf = null;
    let zoom = 1;
    let fitWidth = true;
    let fitHeight = false;
    let renderId = 0;

    async function loadPDF(filename) {
      const thisRender = ++renderId;

      viewer.replaceChildren();
      status.textContent = "Loading " + filename + "…";
      pageCount.textContent = "";
      pdf = null;

      try {
        const task = pdfjsLib.getDocument(filename);
        const documentPDF = await task.promise;

        if (thisRender !== renderId) return;

        pdf = documentPDF;
        status.textContent = "";
        pageCount.textContent = pdf.numPages + " pages";

        // Reset to the beginning when changing projects.
        window.scrollTo(0, 0);
        await renderPages(thisRender);
      } catch (error) {
        if (thisRender !== renderId) return;

        status.textContent =
          "Could not load " + filename +
          ". Check that the PDF is in this folder and the filename matches.";
        console.error(error);
      }
    }

    async function renderPages(thisRender = renderId) {
      if (!pdf) return;

      const currentPDF = pdf;

      // Save the page and approximate position currently being viewed.
      const markerY = Math.max(
        110,
        viewer.getBoundingClientRect().top
      );

      const oldPages = Array.from(
        viewer.querySelectorAll(".page")
      );

      let savedPageIndex = 0;
      let savedPageOffset = 0;

      for (let i = 0; i < oldPages.length; i++) {
        const rect = oldPages[i].getBoundingClientRect();

        if (rect.bottom > markerY) {
          savedPageIndex = i;
          savedPageOffset = markerY - rect.top;
          break;
        }
      }

      viewer.replaceChildren();
      zoomLabel.textContent = Math.round(zoom * 100) + "%";

      for (let n = 1; n <= currentPDF.numPages; n++) {
        if (thisRender !== renderId) return;

        const page = await currentPDF.getPage(n);
        if (thisRender !== renderId) return;

        const base = page.getViewport({ scale: 1 });
        const availableWidth = Math.max(
          240,
          viewer.clientWidth - 24
        );
        const availableHeight = Math.max(
          200,
          window.innerHeight - 140
        );

        let scale;

        if (fitWidth) {
          scale = availableWidth / base.width;
        } else if (fitHeight) {
          scale = availableHeight / base.height;
        } else {
          scale = zoom;
        }

        const viewport = page.getViewport({ scale });
        const canvas = document.createElement("canvas");
        const context = canvas.getContext("2d");
        const ratio = window.devicePixelRatio || 1;

        canvas.width = Math.floor(viewport.width * ratio);
        canvas.height = Math.floor(viewport.height * ratio);
        canvas.style.width = viewport.width + "px";
        canvas.style.height = viewport.height + "px";

        const wrapper = document.createElement("section");
        wrapper.className = "page";
        wrapper.style.width = viewport.width + "px";
        wrapper.appendChild(canvas);
        viewer.appendChild(wrapper);

        await page.render({
          canvasContext: context,
          viewport,
          transform: ratio !== 1
            ? [ratio, 0, 0, ratio, 0, 0]
            : null
        }).promise;
      }

      if (thisRender !== renderId) return;

      // Restore the same page and viewing position after all pages render.
      const newPages = viewer.querySelectorAll(".page");
      const targetPage = newPages[savedPageIndex];

      if (targetPage) {
        const newRect = targetPage.getBoundingClientRect();
        const desiredTop = markerY - savedPageOffset;

        window.scrollBy(0, newRect.top - desiredTop);
      }
    }

    // Switch projects.
    document.getElementById("tabs").addEventListener("click", event => {
      const button = event.target.closest("button[data-pdf]");
      if (!button) return;

      document.querySelectorAll("#tabs button").forEach(tab => {
        tab.classList.toggle("active", tab === button);
      });

      loadPDF(button.dataset.pdf);
    });

    // Zoom out.
    document.getElementById("minus").onclick = () => {
      fitWidth = false;
      fitHeight = false;
      zoom = Math.max(0.25, zoom - 0.1);
      renderPages();
    };

    // Zoom in.
    document.getElementById("plus").onclick = () => {
      fitWidth = false;
      fitHeight = false;
      zoom = Math.min(3, zoom + 0.1);
      renderPages();
    };

    // Fit page width.
    document.getElementById("fit").onclick = () => {
      fitWidth = true;
      fitHeight = false;
      renderPages();
    };

    // Fit page height.
    document.getElementById("fitHeight").onclick = () => {
      fitWidth = false;
      fitHeight = true;
      renderPages();
    };

    // Recalculate fitted pages when the window changes size.
    let resizeTimer;

    window.addEventListener("resize", () => {
      clearTimeout(resizeTimer);

      resizeTimer = setTimeout(() => {
        if (fitWidth || fitHeight) {
          renderPages();
        }
      }, 200);
    });

    // Load the portfolio using the actual filename from the tab.
    loadPDF("Kaminsky_Portfolio.pdf");
  </script>
</body>
</html>
